# =============================================================================
# gitpilot — git workflow MCP server
# Secrets / overrides go in application-local.yml (gitignored) or env vars.
# =============================================================================

spring:
  main:
    banner-mode: off

  application:
    name: gitpilot

  ai:
    mcp:
      server:
        stdio: true
        name: gitpilot

# ---------------------------------------------------------------------------
# Git workspace: the repo to operate on.
# Defaults to the current working directory (where the MCP client spawns).
# Override with GIT_REPO_PATH env var to pin to a specific repo.
# ---------------------------------------------------------------------------
git:
  repo-path: ${GIT_REPO_PATH:${user.dir}}

